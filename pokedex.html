<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pokedex</title>
  <link rel="stylesheet" href="app.css">


</head>
<body>
  
  <div>
    <header class="titulo">
      <h1>Quem é esse pokémon?</h1>
    </header>
    
    
    <main class = "main">
      
      <form class="form" action="" method="POST" enctype="multipart/form-data">

        <input type="text" name="nome" id="nome" required placeholder="Digite o nome do pokémon">
        <button id="btLocalizar" type="submit">Localizar</button>

    </form>

      <div class="conjunto"></div>
        

        

    </main>

  </div>







  <script>

  // --- SEU CÓDIGO ORIGINAL DE EXIBIÇÃO (MANTIDO EXATAMENTE IGUAL) ---
async function exibirPokemons() {
  try {
    const resposta = await fetch('https://pokeapi.co/api/v2/pokemon?limit=151');  
    const dados = await resposta.json();

    const promessasDetalhes = dados.results.map(pokemon => 
      fetch(pokemon.url).then(res => res.json())
    );

    const listaCompleta = await Promise.all(promessasDetalhes);
    const conjunto = document.querySelector('.conjunto');

    for (let i = 0; i < listaCompleta.length; i++) {
      const pokemon = listaCompleta[i];
      const nome = pokemon.name;
      const imagemUrl = pokemon.sprites.front_default;

      const divPkm = document.createElement('div');
      divPkm.classList.add('nomePkm');

      const img = document.createElement('img');
      img.src = imagemUrl;
      img.alt = nome;

      const paragrafo = document.createElement('p');
      paragrafo.textContent = nome;

      divPkm.appendChild(img);
      divPkm.appendChild(paragrafo);
      conjunto.appendChild(divPkm);
    }

  } catch (erro) {
    console.error('Erro ao buscar e exibir os Pokémons:', erro);
  }
}

exibirPokemons();


// 1. Seleciona o campo de texto e o botão de localizar do seu HTML
const campoBusca = document.getElementById("nome");
const botaoBuscar = document.getElementById("btLocalizar");

// 2. Cria a função que vai filtrar os Pokémons na tela
function filtrarPokemons(event) {
  // Evita que o formulário recarregue a página ao clicar no botão
  event.preventDefault();

  // Pega o que foi digitado e transforma em letras minúsculas
  const termo = campoBusca.value.toLowerCase();

  // Seleciona todas as divs dos pokémons (.nomePkm) que foram criadas na tela
  const divsPokemons = document.querySelectorAll(".nomePkm");

  // Percorre div por div aplicando o filtro
  divsPokemons.forEach(div => {
    // Pega o texto do parágrafo <p> que está dentro da div do Pokémon
    const nomePokemon = div.querySelector("p").textContent.toLowerCase();

    // Se o nome do Pokémon conter o termo digitado, ele aparece. Se não, esconde.
    if (nomePokemon.includes(termo)) {
      div.style.display = ""; // Mostra a div normalmente
    } else {
      div.style.display = "none"; // Esconde a div
    }
  });
}

// 3. Ativa a função quando o botão de Localizar for clicado
botaoBuscar.addEventListener("click", filtrarPokemons);






  </script>

</body>
</html>
